<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa Bíblica</title>

  <!-- Ícones -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pesquisa Bíblica">
  <meta name="theme-color" content="#0078D7">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    img { width: 180px; height: 180px; object-fit: contain; }
    h1 { margin: 15px 0 25px; color: #0078D7; font-size: 34px; }
    h2 { margin: 15px 0 10px; color: #0078D7; font-size: 24px; }
    .container { width: 100%; max-width: 500px; }

    .instrucao {
      margin: 20px auto 15px;
      padding: 18px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #333;
      font-size: 18px;
      line-height: 1.5;
      text-align: left;
    }
    .instrucao b { color: #0078D7; }

    /* Estilo padrão para input e select */
    input, select {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      margin-bottom: 15px;
      border: 2px solid #0078D7;
      border-radius: 8px;
      display: block;
      background-color: white;
      color: #333;
    }
    
    select {
      cursor: pointer;
      appearance: auto; /* mantém a setinha padrão do sistema */
    }

    .button-wrapper {
      display: flex;
      justify-content: flex-end;
    }

    button {
      padding: 20px 32px;
      font-size: 26px;
      background-color: #0078D7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button:hover { background-color: #005fa3; }

    .btn-verde { background-color: #4CAF50; }
    .btn-verde:hover { background-color: #388E3C; }

    .btn-principal { width: 100%; margin-top: 20px; }

    .dica { margin-top: 10px; font-size: 16px; color: #666; }
    
    .divisor {
      width: 100%;
      height: 1px;
      background-color: #ddd;
      margin: 30px 0;
    }
  </style>
</head>
<body>

  <!-- TELA 1: instruções de instalação -->
  <div id="telaInstalacao" class="container" style="display:none;">
    <img src="icon-192.png" alt="Ícone Pesquisa Bíblica">
    <h1>Pesquisa Bíblica</h1>

    <div class="instrucao">
      <p style="margin-top:0;"><b>iPhone / iPad:</b><br>
      Toque em <b>Compartilhar</b> (⬆️) → <b>Adicionar à Tela de Início</b>.</p>
      <p style="margin-bottom:0;"><b>Android:</b><br>
      Toque no menu (⋮) → <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>
    </div>

    <button id="btnPular" class="btn-principal">Pesquisar agora</button>
  </div>

  <!-- TELA 2: pesquisa e compartilhamento -->
  <div id="telaPesquisa" class="container" style="display:none;">
    <h1>Pesquisa Bíblica</h1>
    
    <!-- Pesquisa -->
    <select id="pesquisaRapida" onchange="preencherTermo()">
      <option value="">-- Escolha um tema rápido --</option>
      <option value="Perguntas frequentes">Perguntas frequentes</option>
      <option value="Perguntas frequentes">Glossário da Bíblia</option>
      <option value="Texto bíblico">Texto bíblico</option>
      <option value="Perguntas respondidas">Perguntas respondidas</option>
      <option value="Assuntos da Bíblia">Assuntos da Bíblia</option>
      <option value="Bíblia de estudo">Bíblia de estudo</option>
      <option value="Vida e ministério">Vida e ministério</option>
      <option value="Notícias">Notícias</option>
    </select>

    <input type="text" id="termo" placeholder="Ou digite um tema (ex: Rei Davi)"
           autocomplete="off" autocorrect="off" autocapitalize="sentences">
    <button onclick="pesquisar()">Pesquisar no JW.org</button>
    
    <div class="divisor"></div>

    <!-- Compartilhar Matéria -->
    <h2>Salvar / Compartilhar</h2>
    <p class="dica">Copie o link da matéria no JW.org, cole abaixo e envie para suas Notas ou E-mail.</p>
    <input type="url" id="linkMateria" placeholder="Cole o link do JW.org aqui" autocomplete="off">
    <button onclick="compartilharLink()" class="btn-verde">Compartilhar Matéria</button>

  </div>

  <script>
    const URL_BASE = "https://www.jw.org/pt/busca/";

    function ehStandalone() {
      return window.navigator.standalone === true
          || window.matchMedia('(display-mode: standalone)').matches;
    }

    function ehMobile() {
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    }

    function mostrar(id) {
      document.getElementById('telaInstalacao').style.display = 'none';
      document.getElementById('telaPesquisa').style.display = 'none';
      document.getElementById(id).style.display = 'block';
    }

    function inicializar() {
      if (ehStandalone() || !ehMobile()) {
        mostrar('telaPesquisa');
      } else {
        mostrar('telaInstalacao');
      }

      document.getElementById('btnPular').addEventListener('click', function () {
        mostrar('telaPesquisa');
        setTimeout(function () {
          document.getElementById('termo').focus();
        }, 100);
      });

      // Enter no teclado dispara a pesquisa
      const input = document.getElementById('termo');
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          pesquisar();
        }
      });
    }

    // Função que preenche o input quando o usuário escolhe na lista
    function preencherTermo() {
      const select = document.getElementById('pesquisaRapida');
      const input = document.getElementById('termo');
      
      if (select.value !== "") {
        input.value = select.value;
      }
    }

    // Função de Pesquisa
    function pesquisar() {
      const termo = document.getElementById('termo').value.trim();
      if (!termo) {
        document.getElementById('termo').focus();
        return;
      }
      const url = URL_BASE + "?q=" + encodeURIComponent(termo);
      window.open(url, "_blank", "noopener");
    }

    // Função de Compartilhar Link
    function compartilharLink() {
      const inputLink = document.getElementById('linkMateria');
      const link = inputLink.value.trim();

      if (!link) {
        inputLink.focus();
        return;
      }

      if (navigator.share) {
        navigator.share({
          title: 'Pesquisa Bíblica - JW.org',
          text: 'Confira esta matéria de estudo:',
          url: link
        }).then(() => {
          inputLink.value = ''; 
        }).catch((error) => {
          console.log('Compartilhamento cancelado ou erro', error);
        });
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(link).then(() => {
            alert("Link copiado para a área de transferência!");
            inputLink.value = '';
          }).catch(err => {
            alert("Erro ao copiar. Verifique as permissões.");
          });
        } else {
          inputLink.select();
          document.execCommand('copy');
          alert("Link copiado!");
          inputLink.value = '';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', inicializar);
  </script>
</body>
</html>
